<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasicAcc v1.4 - Perbaikan Kalkulasi Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-menu { @apply bg-blue-800 text-white border-l-4 border-yellow-400; }
        .page-content { display: none; }
        .page-content.active { display: block; }
        .table-acc { @apply min-w-full bg-white border border-gray-300; }
        .table-acc th { @apply border px-4 py-2 bg-gray-100 text-left text-xs font-bold uppercase text-gray-600; }
        .table-acc td { @apply border px-4 py-2 text-sm text-gray-700; }
        input:focus { @apply outline-none ring-2 ring-blue-400; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div class="flex flex-col md:flex-row min-h-screen">
        <div class="bg-blue-900 text-blue-100 w-full md:w-64 p-4 shadow-xl">
            <div class="p-4 text-2xl font-bold border-b border-blue-800 mb-6 flex items-center gap-2">
                <span class="bg-yellow-400 text-blue-900 px-2 rounded">A</span>
                BasicAcc
            </div>
            <nav id="sidebar-nav">
                <button onclick="showPage('dashboard')" class="nav-btn w-full text-left py-3 px-4 rounded mb-1 transition active-menu" id="btn-dashboard">Dashboard</button>
                <div class="text-xs uppercase text-blue-400 font-bold px-4 pt-4 pb-2">Transaksi</div>
                <button onclick="showPage('jurnal')" class="nav-btn w-full text-left py-3 px-4 rounded mb-1 transition" id="btn-jurnal">Jurnal Umum</button>
                <div class="text-xs uppercase text-blue-400 font-bold px-4 pt-4 pb-2">Laporan</div>
                <button onclick="showPage('buku-besar')" class="nav-btn w-full text-left py-3 px-4 rounded mb-1 transition" id="btn-buku-besar">Buku Besar</button>
                <button onclick="showPage('neraca-lajur')" class="nav-btn w-full text-left py-3 px-4 rounded mb-1 transition" id="btn-neraca-lajur">Neraca Lajur</button>
                <button onclick="showPage('laporan-keuangan')" class="nav-btn w-full text-left py-3 px-4 rounded mb-1 transition" id="btn-laporan-keuangan">Laporan Keuangan</button>
            </nav>
        </div>

        <div class="flex-1 p-6 md:p-10">
            
            <section id="jurnal" class="page-content active">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Jurnal Umum</h2>
                    <div id="status-balance" class="text-sm font-bold px-4 py-2 rounded shadow-sm bg-gray-200 text-gray-700">
                        Status: Menunggu Input
                    </div>
                </div>
                
                <div class="bg-white p-6 rounded-lg border border-gray-200 mb-8 shadow-sm">
                    <h3 id="form-title" class="font-bold mb-4 text-gray-700">Input Jurnal</h3>
                    <input type="hidden" id="edit-index" value="-1">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-500 uppercase">Tanggal</label>
                            <input type="date" id="input-tgl" class="w-full p-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-500 uppercase">Nama Akun</label>
                            <input type="text" id="input-ket" placeholder="Kas / Modal" class="w-full p-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-500 uppercase">Debit (Rp)</label>
                            <input type="number" id="input-deb" value="0" onfocus="this.select()" class="w-full p-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-500 uppercase">Kredit (Rp)</label>
                            <input type="number" id="input-kre" value="0" onfocus="this.select()" class="w-full p-2 border rounded text-sm">
                        </div>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <button onclick="simpanTransaksi()" id="btn-save" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition">
                            Posting ke Jurnal
                        </button>
                        <button onclick="resetForm()" id="btn-cancel" class="hidden bg-gray-400 text-white px-6 py-2 rounded font-bold hover:bg-gray-500 transition">
                            Batal
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto bg-white rounded-lg shadow-md border border-gray-200">
                    <table class="table-acc" id="tabel-jurnal">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="w-32">Tanggal</th>
                                <th>Keterangan Akun</th>
                                <th class="text-right w-48">Debit (Rp)</th>
                                <th class="text-right w-48">Kredit (Rp)</th>
                                <th class="text-center w-24">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="journal-body">
                            </tbody>
                        <tfoot>
                            <tr class="bg-gray-100 font-bold border-t-2 border-gray-400 text-lg">
                                <td colspan="2" class="text-right p-4">TOTAL :</td>
                                <td id="total-debit" class="text-right p-4 text-blue-700">0</td>
                                <td id="total-kredit" class="text-right p-4 text-blue-700">0</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </section>

            <section id="dashboard" class="page-content">Dashboard Content</section>
            <section id="buku-besar" class="page-content">Buku Besar Content</section>
            <section id="neraca-lajur" class="page-content">Neraca Lajur Content</section>
            <section id="laporan-keuangan" class="page-content">Laporan Keuangan Content</section>

        </div>
    </div>

    <script>
        // Data Awal (Opsional)
        let transactions = [];

        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-menu'));
            const btn = document.getElementById('btn-' + pageId);
            if(btn) btn.classList.add('active-menu');
        }

        function simpanTransaksi() {
            const tgl = document.getElementById('input-tgl').value;
            const ket = document.getElementById('input-ket').value;
            const deb = parseFloat(document.getElementById('input-deb').value) || 0;
            const kre = parseFloat(document.getElementById('input-kre').value) || 0;
            const editIndex = parseInt(document.getElementById('edit-index').value);

            if (!tgl || !ket) { alert("Harap isi Tanggal dan Nama Akun!"); return; }

            const data = { tgl, ket, deb, kre };

            if (editIndex === -1) {
                transactions.push(data);
            } else {
                transactions[editIndex] = data;
            }

            resetForm();
            renderTable();
        }

        function renderTable() {
            const body = document.getElementById('journal-body');
            body.innerHTML = '';
            
            let sumDebit = 0;
            let sumKredit = 0;

            if (transactions.length === 0) {
                body.innerHTML = '<tr><td colspan="5" class="text-center p-10 text-gray-400 italic">Belum ada transaksi. Silakan input di atas.</td></tr>';
            }

            transactions.forEach((item, index) => {
                sumDebit += item.deb;
                sumKredit += item.kre;

                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50 border-b transition";
                row.innerHTML = `
                    <td class="p-3">${item.tgl}</td>
                    <td class="p-3 ${item.deb === 0 ? 'pl-10 italic text-gray-500' : 'font-bold text-blue-900'}">${item.ket}</td>
                    <td class="p-3 text-right font-mono">${item.deb.toLocaleString('id-ID')}</td>
                    <td class="p-3 text-right font-mono">${item.kre.toLocaleString('id-ID')}</td>
                    <td class="p-3 text-center">
                        <div class="flex justify-center gap-1">
                            <button onclick="editData(${index})" class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs border border-amber-300 hover:bg-amber-200">Edit</button>
                            <button onclick="hapusData(${index})" class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs border border-red-300 hover:bg-red-200">Hapus</button>
                        </div>
                    </td>
                `;
                body.appendChild(row);
            });

            // Update Angka Total di Bawah
            document.getElementById('total-debit').innerText = "Rp " + sumDebit.toLocaleString('id-ID');
            document.getElementById('total-kredit').innerText = "Rp " + sumKredit.toLocaleString('id-ID');

            // Logika Status Balance
            const statusBox = document.getElementById('status-balance');
            if (transactions.length > 0) {
                if (sumDebit === sumKredit) {
                    statusBox.innerText = "Status: Balance ✓";
                    statusBox.className = "text-sm font-bold px-4 py-2 rounded shadow-sm bg-green-500 text-white";
                } else {
                    statusBox.innerText = "Status: TIDAK BALANCE ✗";
                    statusBox.className = "text-sm font-bold px-4 py-2 rounded shadow-sm bg-red-500 text-white";
                }
            } else {
                statusBox.innerText = "Status: Menunggu Input";
                statusBox.className = "text-sm font-bold px-4 py-2 rounded shadow-sm bg-gray-200 text-gray-700";
            }
        }

        function hapusData(index) {
            if (confirm("Hapus baris ini?")) {
                transactions.splice(index, 1);
                renderTable();
            }
        }

        function editData(index) {
            const data = transactions[index];
            document.getElementById('input-tgl').value = data.tgl;
            document.getElementById('input-ket').value = data.ket;
            document.getElementById('input-deb').value = data.deb;
            document.getElementById('input-kre').value = data.kre;
            document.getElementById('edit-index').value = index;
            
            document.getElementById('form-title').innerText = "Edit Data Jurnal";
            document.getElementById('btn-save').innerText = "Simpan Perubahan";
            document.getElementById('btn-cancel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('input-tgl').value = "";
            document.getElementById('input-ket').value = "";
            document.getElementById('input-deb').value = "0";
            document.getElementById('input-kre').value = "0";
            document.getElementById('edit-index').value = "-1";
            document.getElementById('form-title').innerText = "Input Jurnal";
            document.getElementById('btn-save').innerText = "Posting ke Jurnal";
            document.getElementById('btn-cancel').classList.add('hidden');
        }

        // Jalankan renderTable saat pertama kali buka agar tabel muncul
        renderTable();
    </script>
</body>
</html>
